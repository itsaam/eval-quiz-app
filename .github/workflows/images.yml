name: Stacklab images

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

defaults:
  run:
    shell: bash

jobs:
  image:
    name: Build and scan (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: web
            context: .
          - name: api
            context: ./backend
    env:
      IMAGE: ghcr.io/itsaam/stacklab-${{ matrix.name }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build image
        env:
          BUILD_CONTEXT: ${{ matrix.context }}
        run: |
          docker build --platform linux/amd64 --tag "$IMAGE" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" "$BUILD_CONTEXT"
      - name: Block critical vulnerabilities
        run: |
          docker save "$IMAGE" | docker run --rm -i --entrypoint sh \
            aquasec/trivy@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb \
            -ec 'cat > /tmp/image.tar && trivy image --input /tmp/image.tar --scanners vuln --severity CRITICAL --exit-code 1 --no-progress'
      - name: Publish commit image
        if: github.event_name == 'push'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE"
